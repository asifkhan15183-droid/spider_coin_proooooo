name = "fancy-meadow-b776"
main = "src/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "spider-coin-db"
database_id = "08a8ae68-2d1b-4b85-b328-e520245c5e7b"
migrations_dir = "migrations"

[vars]
PROJECT_NAME = "Spider Coin"
COIN_NAME = "Spider Coin"
COIN_SYMBOL = "SPC"
MINING_RATE_PER_HOUR = "1"
MINING_CYCLE_HOURS = "24"
REFERRAL_REWARD = "100"
PROMO_NORMAL_PRICE_USDT = "2"
PROMO_UNIQUE_PRICE_USDT = "5"
USDT_BSC_CHAIN_ID = "56"
USDT_BSC_CONTRACT = "0x55d398326f99059fF775485246999027B3197955"
USDT_RECEIVER_ADDRESS = "REPLACE_WITH_BEP20_RECEIVING_ADDRESS"
SUPPORTER_PASS_PRICE_USDT = "5"
WITHDRAWALS_ENABLED = "false"
